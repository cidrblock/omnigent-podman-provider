# Egress CONNECT proxy for an egress-fenced sandbox.
#
# The fence permits exactly one address and port, so this file is the sandbox's
# entire internet: hostname allowlist, 443 only, deny by default, no caching and
# no TLS interception (the proxy sees the target host, never the payload).
http_port 3128
visible_hostname sandbox-egress
httpd_suppress_version_string on
via off
forwarded_for delete
cache deny all
cache_dir null /tmp
pid_filename none
coredump_dir /tmp
access_log stdio:/dev/stderr squid
cache_log stdio:/dev/stderr
strip_query_terms on

# Loopback is shared with every local process, so an allowlist without auth
# would be an open relay for anything running on the machine.
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm sandbox-egress
auth_param basic credentialsttl 8 hours
acl authenticated proxy_auth REQUIRED

acl SSL_ports port 443
acl allowed_sites dstdomain \
    .github.com .githubusercontent.com \
    .pypi.org .pythonhosted.org \
    .npmjs.org

# CONNECT is only ever permitted to 443, so SSH (22), git:// (9418) and QUIC are
# not expressible. Plain HTTP never matches SSL_ports, so there is no
# unencrypted egress path either.
http_access deny CONNECT !SSL_ports
http_access allow authenticated allowed_sites SSL_ports
http_access deny all
